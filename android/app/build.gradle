plugins { id 'com.android.application' }
def existingDebugKey = System.getenv('HANYUFLOW_DEBUG_KEYSTORE') ?: new File(System.getProperty('user.home'), '.android/debug.keystore').absolutePath
if (!new File(existingDebugKey).exists()) throw new GradleException('An existing debug keystore is required. Do not create persistent signing credentials without user approval.')
android {
    namespace 'com.hanyuflow.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.hanyuflow.android'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.1-android'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs { existingDebug { storeFile file(existingDebugKey); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes {
        debug { signingConfig signingConfigs.existingDebug; debuggable true }
        release { signingConfig null; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['m4a'] }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
